[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-ascend"
version = "3.8.0+plugin"
description = "Huawei Ascend backend for Triton (out-of-tree plugin)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "triton>=3.8.0",
  "attrs==24.2.0",
  "numpy==1.26.4",
  "decorator==5.1.1",
  "psutil==6.0.0",
  "pyyaml",
  "pybind11",
]

[project.entry-points."triton.backends"]
ascend = "triton.backends.ascend"

[tool.triton-ext]
status = "experimental"
enabled = true

# L1 puncture: backend only. L2b adds language/cann (needs native + buffer_ir).
[tool.setuptools.packages.find]
where = ["python"]
include = ["triton.backends*"]

[tool.setuptools.package-data]
"triton.backends.ascend" = ["name.conf", "*.cpp", "lib/**/*"]
